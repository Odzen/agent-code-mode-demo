[project]
name = "agent-code-mode-demo"
version = "0.1.0"
description = "A side-by-side comparison of agent tool calling and Code Mode."
requires-python = ">=3.13,<3.16"
dependencies = [
    "fastapi[standard]==0.162.2",
    "httpx",
    "pydantic==2.14.3",
    "pydantic-ai-slim[openai]==2.66.0",
    "pydantic-ai-harness[code-mode]==0.66.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
